[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "article-learning"
version = "0.1.0"
description = "Adversarial multi-agent framework for paper derivation and annotation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "article-learning" }]
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2.40",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.7.0",
    "networkx>=3.2",
    "rich>=13.7",
    "tenacity>=8.2",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
pdf = [
    "marker-pdf>=0.2.17",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/article_learning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP042"]  # We deliberately use (str, Enum); StrEnum changes pydantic serialization.

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402", "I001"]  # Path manipulation before imports is intentional.

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
